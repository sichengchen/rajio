name: Prepare macOS release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version to prepare (current retries an existing version)
        default: patch
        options:
          - current
          - patch
          - minor
          - major
        required: true
        type: choice

permissions:
  contents: read

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  bump:
    name: Prepare release version
    if: github.repository == 'sichengchen/rajio' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prepare and push release version
        id: version
        env:
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          release_version="$(node scripts/version.mjs current)"
          if [[ "$INPUT_BUMP" != current ]]; then
            release_version="$(node scripts/version.mjs bump "$release_version" "$INPUT_BUMP")"
          fi
          tag="v${release_version}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists" >&2
            exit 1
          fi

          if [[ "$INPUT_BUMP" != current ]]; then
            node scripts/version.mjs set "$release_version"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/desktop/package.json apps/server/package.json packages/contracts/package.json
            git commit -m "chore(release): prepare ${tag}" \
              -m "Co-Authored-By: Sicheng Chen (bot) <gh-bot@scchan.com>"
            git push origin HEAD:main
          fi

          {
            echo "release=${release_version}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  prepare:
    name: Build and test the release artifact
    needs: bump
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.bump.outputs.release }}
      RELEASE_SHA: ${{ needs.bump.outputs.sha }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and test
        # Workspace tests include the Rust/Wasm package.
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.100 --locked
          pnpm check
          pnpm test

      - name: Build universal macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          pnpm --filter @rajio-app/desktop build
          pnpm --filter @rajio-app/desktop exec electron-builder --mac dir --universal \
            --config.mac.identity=- --config.mac.hardenedRuntime=false \
            --config.mac.notarize=false --publish never
          app="apps/desktop/release/mac-universal/Rajio.app"
          lipo "$app/Contents/MacOS/Rajio" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"

      - name: Smoke test packaged app startup
        run: |
          set -euo pipefail
          app_path="apps/desktop/release/mac-universal/Rajio.app"
          executable="$app_path/Contents/MacOS/Rajio"
          marker="$RUNNER_TEMP/rajio-startup-ready"
          startup_log="$RUNNER_TEMP/rajio-startup.log"
          rm -f "$marker" "$startup_log"

          RAJIO_STARTUP_SMOKE_PATH="$marker" "$executable" > "$startup_log" 2>&1 &
          app_pid=$!

          cleanup_app() {
            if kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid" 2>/dev/null || true
              for _ in {1..5}; do
                if ! kill -0 "$app_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              if kill -0 "$app_pid" 2>/dev/null; then
                kill -9 "$app_pid" 2>/dev/null || true
              fi
            fi
            wait "$app_pid" 2>/dev/null || true
          }

          for _ in {1..30}; do
            if [[ -f "$marker" ]]; then
              cleanup_app
              exit 0
            fi

            if ! kill -0 "$app_pid" 2>/dev/null; then
              wait "$app_pid" || true
              cat "$startup_log"
              exit 1
            fi

            sleep 1
          done

          cleanup_app
          cat "$startup_log"
          echo "Packaged Rajio did not finish startup within 30 seconds" >&2
          exit 1

      - name: Prepare signing handoff
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rajio-release"
          ditto -c -k --norsrc --keepParent \
            apps/desktop/release/mac-universal/Rajio.app "$RUNNER_TEMP/rajio-release/app.zip"
          jq -n --arg sha "$RELEASE_SHA" --arg version "$RELEASE_VERSION" \
            '{sha: $sha, version: $version}' > "$RUNNER_TEMP/rajio-release/release.json"
          printf 'Signing workflow: https://github.com/sichengchen/macos-release/actions/workflows/release-macos.yml\n\nBuild run ID: %s\n' \
            "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release-app-${{ github.run_attempt }}
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ runner.temp }}/rajio-release/app.zip
            ${{ runner.temp }}/rajio-release/release.json
