name: iOS client
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - run: brew install xcodegen
      - run: cargo build --locked -p rajio-core
      - run: swift test --package-path packages/ios-library --scratch-path target/ios-library -Xlinker -L -Xlinker "$PWD/target/debug"
      - run: bash scripts/build-core-ios.sh
      - run: xcodegen generate --spec apps/ios/project.yml
      - run: xcodebuild -project apps/ios/Rajio.xcodeproj -scheme Rajio -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath target/ios CODE_SIGNING_ALLOWED=NO build

      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify offline listening in Simulator
        run: |
          node scripts/check-ios-localization.mjs
          node scripts/ios-fixture-server.mjs > "$RUNNER_TEMP/rajio-fixtures.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          device_id=$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(Object.values(JSON.parse(s).devices).flat().find(d=>d.name.startsWith("iPhone")).udid))')
          xcodebuild -project apps/ios/Rajio.xcodeproj -scheme Rajio -destination "platform=iOS Simulator,id=$device_id" -parallel-testing-enabled NO -derivedDataPath target/ios CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-results
          path: target/ios/Logs/Test
